[project]
name = "pdfsplit"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pikepdf", "rich"]

[project.scripts]
pdfsplit = "pdfsplit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pdfsplit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
]
