---
name: Merge Gate

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          for f in README.md .gitignore AGENTS.md; do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f"
              exit 1
            fi
            echo "$f: found"
          done

  python-quality:
    name: Python Quality (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - docgui
          - ebooktool
          - mp4audio
          - mp4subs
          - officetools
          - pdf2md
          - pdfcompress
          - pdfconcat
          - pdfocr
          - pdfsplit
          - videogui
          - videocompress
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Lint with ruff
        run: uvx ruff check
      - name: Type check with pyright
        run: uvx pyright
      - name: Check for tests
        id: check-tests
        run: |
          if [ -d tests ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Test with pytest
        if: steps.check-tests.outputs.exists == 'true'
        run: >
          uv run pytest
          --cov --cov-branch --cov-fail-under=90
          --cov-report=term-missing

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql-scan:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  required-checks:
    name: Required Checks (Merge)
    runs-on: ubuntu-latest
    needs:
      - repo-hygiene
      - python-quality
      - dependency-scan
      - secret-scanning
      - codeql-scan
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          RESULT="success"
          for job in \
            repo-hygiene python-quality dependency-scan \
            secret-scanning codeql-scan; do
            STATUS="${{ needs[format('{0}', job)].result }}"
            if [ "$STATUS" != "success" ]; then
              echo "$job: $STATUS"
              RESULT="failure"
            fi
          done
          if [ "$RESULT" != "success" ]; then
            exit 1
          fi
          echo "All required checks passed"
