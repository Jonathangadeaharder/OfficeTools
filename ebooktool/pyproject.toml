[project]
name = "ebooktool"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "ebooklib>=0.18",
    "markdown>=3.7",
    "fpdf2>=2.8.7",
]

[project.scripts]
ebooktool = "ebooktool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
]
