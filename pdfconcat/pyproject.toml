[project]
name = "pdfconcat"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pikepdf", "rich"]

[project.scripts]
pdfconcat = "pdfconcat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pdfconcat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
]
