[project]
name = "pdf2md"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "docling[vlm]",
    "fpdf2>=2.8.7",
    "mlx-vlm",
]

[project.scripts]
pdf2md = "pdf2md.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
]
