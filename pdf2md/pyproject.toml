[project]
name = "pdf2md"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "pymupdf4llm>=1.26.0",
    "pymupdf>=1.26.0",
]

[project.scripts]
pdf2md = "pdf2md.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
]
